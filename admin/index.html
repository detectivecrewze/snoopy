<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snoopy Gift Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@500;600&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{display:grid;min-width:320px;min-height:100vh;margin:0;place-items:center;padding:24px;color:#171717;background:radial-gradient(circle at 18px 18px,rgba(248,212,76,.28) 0 3px,transparent 3.5px) 0 0/64px 64px,#fff8df;font-family:"DM Sans",sans-serif}.note{position:relative;width:min(100%,560px);padding:clamp(2rem,7vw,4rem);border:3px solid #171717;border-radius:8px 28px 12px 22px;background:#fffdf4;box-shadow:10px 12px 0 #171717;text-align:center}.note:before{content:"ADMIN";position:absolute;top:-18px;left:50%;padding:.55rem 1rem;border:2px solid #171717;border-radius:8px;color:#fff;background:#e94238;font:700 .7rem "Fredoka",sans-serif;letter-spacing:.12em;transform:translateX(-50%) rotate(-2deg)}h1{margin:.4rem 0;font:700 clamp(2.2rem,9vw,4rem)/1 "Fredoka",sans-serif}p{margin:.8rem auto 0;color:#6f695e;font:600 1.2rem/1.4 "Caveat",cursive}
  </style>
</head>
<body><main class="note"><h1>Admin sedang disiapkan</h1><p>Routing-nya sudah siap. Dashboard dan generator internal akan dibangun pada Step 3 setelah Worker tersedia.</p></main></body>
</html>
