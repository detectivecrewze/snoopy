name = "snoopy-gift-api"
main = "src/index.js"
compatibility_date = "2026-08-20"

[vars]
ALLOWED_ORIGINS = "https://your-vercel-domain.vercel.app"
PUBLIC_GIFT_BASE_URL = "https://your-vercel-domain.vercel.app"
PUBLIC_STUDIO_BASE_URL = "https://your-vercel-domain.vercel.app"
MEDIA_BASE_URL = "https://your-r2-cdn.example.com"

[[kv_namespaces]]
binding = "GIFT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "snoopy-gift-media"
